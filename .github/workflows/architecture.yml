name: Repository architecture

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate architecture contract
        run: python3 .architecture/check.py
      - name: Validate architecture links and anchors
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: --config .architecture/lychee.toml --offline --include-fragments=anchor-only --no-progress README.md AGENTS.md CLAUDE.md docs/CLAUDE.md docs/architecture/README.md
          fail: true

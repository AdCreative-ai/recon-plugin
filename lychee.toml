# lychee config — repo-wide link check (see tools/check-links.sh).
#
# Excluded on purpose:
#   - own-repo blob links: verified against the WORKING TREE by check-links.sh
#     instead. GitHub's master branch lags a pre-commit run, so a file added in
#     the commit being made would 404 on github.com while being perfectly correct
#     locally. The local tree is the right source of truth here.
#   - auth-walled hosts (Jira, claude.ai artifacts): a checker cannot see them.
#   - placeholders: shell vars in example commands, «SLOT: …» template markers
#     (percent-encoded to %C2%AB… once resolved).
#   - the six exact private architecture-owner and producer files below:
#     anonymous GitHub requests return 404. Maintainers verify them with authenticated access
#     using docs/architecture/README.md#verification and the shared maintenance
#     playbook. No other architecture URL or GitHub 404 is exempted.

exclude = [
  '^https://github\.com/AdCreative-ai/recon-plugin/blob/',
  'atlassian\.net',
  'claude\.ai',
  '\$\{?[A-Z_]+',
  '%C2%AB',
  '«',
  '^https://github\.com/doruksahin/plugin-architecture/blob/main/docs/maintenance\.md(#check-links)?$',
  '^https://github\.com/doruksahin/plugin-architecture/blob/main/docs/views\.md$',
  '^https://github\.com/doruksahin/plugin-architecture/blob/main/standard/README\.md$',
  '^https://github\.com/doruksahin/plugin-architecture/blob/f9961a34ba3665597e8d1d367e295e88f5aa1fea/tools/check-repository\.py$',
  '^https://github\.com/doruksahin/plugin-architecture/blob/main/docs/workflows\.md$',
  '^https://github\.com/doruksahin/jira-to-packet/blob/main/docs/architecture/README\.md$',
]

exclude_path = [".git", "runs"]

cache = true
max_cache_age = "1d"
max_retries = 2
timeout = 15
